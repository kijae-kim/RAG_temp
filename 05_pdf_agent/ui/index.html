<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>논문 AI 챗봇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 헤더: 드래그 핸들 + 탭 -->
  <header class="header">
    <span class="header-title">🤖 논문 AI 챗봇</span>
    <div class="header-right">
      <div class="tabs">
        <button class="tab active" id="tab-chat" onclick="switchTab('chat')">채팅</button>
        <button class="tab" id="tab-analysis" onclick="switchTab('analysis')">분석</button>
        <button class="tab" id="tab-settings" onclick="switchTab('settings')">설정</button>
      </div>
      <button class="btn-close" onclick="closeWindow()" title="닫기">✕</button>
    </div>
  </header>

  <!-- 논문 배너 -->
  <div class="paper-banner" id="paper-banner">
    <span id="banner-text">논문을 선택해주세요</span>
  </div>

  <!-- 상태 배너 (모델 로딩, 오류 등) -->
  <div class="status-banner hidden" id="status-banner">
    <span id="status-banner-text"></span>
  </div>

  <!-- 채팅 탭 -->
  <div class="tab-content" id="pane-chat">
    <div class="chat-area" id="chat-area"></div>
    <div class="input-area">
      <div class="style-selector">
        <button class="style-btn" onclick="setStyle('brief')">간결</button>
        <button class="style-btn active" id="style-default" onclick="setStyle('default')">기본</button>
        <button class="style-btn" onclick="setStyle('detailed')">상세</button>
      </div>
      <textarea
        id="question-input"
        placeholder="질문을 입력하세요... (Shift+Enter로 줄바꿈)"
        rows="3"
      ></textarea>
      <div class="input-actions">
        <button class="btn-send" id="btn-send" onclick="sendMessage()">전송</button>
        <button class="btn-clear" onclick="clearSession()">초기화</button>
      </div>
    </div>
  </div>

  <!-- 분석 탭 -->
  <div class="tab-content hidden" id="pane-analysis">
    <!-- 진행률 바 -->
    <div class="analysis-progress-wrap">
      <div class="analysis-progress-bar">
        <div class="analysis-progress-fill" id="analysis-progress" style="width:0%"></div>
      </div>
      <span class="analysis-progress-text" id="analysis-progress-text">논문을 선택하면 자동으로 분석됩니다.</span>
    </div>

    <!-- 요약 -->
    <div class="analysis-section hidden" id="analysis-summary">
      <h3 class="analysis-title">📋 논문 요약</h3>
      <p class="analysis-text" id="summary-text"></p>
    </div>

    <!-- 핵심 개념 -->
    <div class="analysis-section hidden" id="analysis-concepts">
      <h3 class="analysis-title">🏷️ 핵심 개념</h3>
      <div class="concepts-container" id="concepts-tags"></div>
    </div>
  </div>

  <!-- 설정 탭 -->
  <div class="tab-content hidden" id="pane-settings">
    <div class="settings-area">

      <!-- 프로바이더 선택 -->
      <div class="settings-section">
        <h3 class="settings-title">LLM 프로바이더</h3>
        <div class="provider-btns" id="provider-btns">
          <button class="provider-btn" data-provider="ollama" onclick="selectProvider('ollama')">Ollama (로컬)</button>
          <button class="provider-btn" data-provider="openai" onclick="selectProvider('openai')">OpenAI</button>
          <button class="provider-btn" data-provider="anthropic" onclick="selectProvider('anthropic')">Anthropic</button>
        </div>
      </div>

      <!-- 모델 선택 -->
      <div class="settings-section">
        <h3 class="settings-title">모델</h3>
        <select class="settings-select" id="model-select"></select>
      </div>

      <!-- API 키 입력 (ollama는 숨김) -->
      <div class="settings-section" id="apikey-section">
        <h3 class="settings-title">API 키</h3>
        <input
          class="settings-input"
          id="api-key-input"
          type="password"
          placeholder="sk-..."
        />
        <p class="settings-hint" id="apikey-hint"></p>
      </div>

      <!-- 저장 + 연결 테스트 -->
      <div class="settings-actions">
        <button class="btn-settings-save" onclick="saveSettings()">저장</button>
        <button class="btn-settings-test" onclick="testConnection()">연결 테스트</button>
      </div>

      <!-- 결과 메시지 -->
      <p class="settings-msg hidden" id="settings-msg"></p>

    </div>
  </div>

  <script src="chat.js"></script>
  <script src="analysis.js"></script>
  <script src="settings.js"></script>
</body>
</html>
