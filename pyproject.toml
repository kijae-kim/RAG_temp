[tool.poetry]
name = "rag-study"
version = "0.1.0"
description = "RAG & LangChain 학습 프로젝트"
authors = ["gimgijae"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

# LangChain Core
langchain = ">=0.3.0"
langchain-core = ">=0.3.0"
langchain-community = ">=0.3.0"
langchain-classic = ">=1.0.0"
langchain-openai = ">=0.2.0"
langchain-anthropic = ">=0.2.0"
langchain-ollama = ">=1.0.0"
langchain-huggingface = ">=0.1.0"
langgraph = ">=0.2.0"

# Vector Stores
chromadb = ">=0.5.0"
faiss-cpu = ">=1.8.0"

# Retriever
rank-bm25 = ">=0.2.2"

# Document Loaders
pypdf = ">=4.0.0"
python-docx = ">=1.0.0"

# Embeddings
sentence-transformers = ">=3.0.0"

# Utils
python-dotenv = ">=1.0.0"
tiktoken = ">=0.7.0"

# Web & API
requests = ">=2.31.0"
beautifulsoup4 = ">=4.12.0"
streamlit = "^1.54.0"
ragas = "^0.4.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "playwright (>=1.58.0,<2.0.0)"
]
